openapi: 3.0.0
info:
  title: NGS - Inventory System API
  description: Complete API specification for NGS Inventory Management System
  version: 1.0.0
  contact:
    name: NGS Development Team
    email: dev@ngs.com

servers:
  - url: http://localhost:3000/api
    description: Development server
  - url: https://api.ngs.com/api
    description: Production server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from login endpoint

  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errors:
          type: object

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: object

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer

    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [ADMIN, USER]
        createdAt:
          type: string
          format: date-time

    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string

    Supplier:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        address:
          type: string

    Item:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        code:
          type: string
        categoryId:
          type: string
        supplierId:
          type: string
        stock:
          type: integer
        minStock:
          type: integer
        unit:
          type: string
        description:
          type: string
        image:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    StockMovement:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [IN, OUT]
        itemId:
          type: string
        quantity:
          type: integer
        date:
          type: string
          format: date-time
        notes:
          type: string
        createdBy:
          type: string

    ActivityLog:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        action:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time

paths:
  # Auth Endpoints
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: '#/components/schemas/User'
                          token:
                            type: string
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: '#/components/schemas/User'
                          token:
                            type: string
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/profile:
    get:
      tags:
        - Authentication
      summary: Get current user profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Items Endpoints
  /items:
    get:
      tags:
        - Items
      summary: Get all items
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: supplier
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [name_asc, name_desc, createdAt_asc, createdAt_desc]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Items retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Item'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

    post:
      tags:
        - Items
      summary: Create new item
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - code
                - categoryId
                - supplierId
                - stock
                - minStock
                - unit
              properties:
                name:
                  type: string
                code:
                  type: string
                categoryId:
                  type: string
                supplierId:
                  type: string
                stock:
                  type: integer
                minStock:
                  type: integer
                unit:
                  type: string
                description:
                  type: string
                image:
                  type: string
                  format: binary
      responses:
        '201':
          description: Item created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Item'

  /items/{id}:
    get:
      tags:
        - Items
      summary: Get item by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Item retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Item'

    put:
      tags:
        - Items
      summary: Update item
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                code:
                  type: string
                categoryId:
                  type: string
                supplierId:
                  type: string
                stock:
                  type: integer
                minStock:
                  type: integer
                unit:
                  type: string
                description:
                  type: string
                image:
                  type: string
                  format: binary
      responses:
        '200':
          description: Item updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Item'

    delete:
      tags:
        - Items
      summary: Delete item
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Item deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # Categories Endpoints
  /categories:
    get:
      tags:
        - Categories
      summary: Get all categories
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Categories retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'

    post:
      tags:
        - Categories
      summary: Create category
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Category'

  /categories/{id}:
    put:
      tags:
        - Categories
      summary: Update category
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: Category updated

    delete:
      tags:
        - Categories
      summary: Delete category
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Category deleted

  # Suppliers Endpoints
  /suppliers:
    get:
      tags:
        - Suppliers
      summary: Get all suppliers
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Suppliers retrieved

    post:
      tags:
        - Suppliers
      summary: Create supplier
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - phone
                - email
              properties:
                name:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                address:
                  type: string
      responses:
        '201':
          description: Supplier created

  /suppliers/{id}:
    put:
      tags:
        - Suppliers
      summary: Update supplier
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Supplier'
      responses:
        '200':
          description: Supplier updated

    delete:
      tags:
        - Suppliers
      summary: Delete supplier
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Supplier deleted

  # Stock Movement Endpoints
  /stock:
    get:
      tags:
        - Stock
      summary: Get stock movements
      security:
        - BearerAuth: []
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [IN, OUT]
        - name: itemId
          in: query
          schema:
            type: string
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Stock movements retrieved

  /stock/in:
    post:
      tags:
        - Stock
      summary: Record stock IN
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - itemId
                - quantity
                - date
              properties:
                itemId:
                  type: string
                quantity:
                  type: integer
                  minimum: 1
                date:
                  type: string
                  format: date-time
                notes:
                  type: string
      responses:
        '201':
          description: Stock IN recorded successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StockMovement'

  /stock/out:
    post:
      tags:
        - Stock
      summary: Record stock OUT
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - itemId
                - quantity
                - date
              properties:
                itemId:
                  type: string
                quantity:
                  type: integer
                  minimum: 1
                date:
                  type: string
                  format: date-time
                notes:
                  type: string
      responses:
        '201':
          description: Stock OUT recorded successfully

  # Reports Endpoints
  /reports/stock:
    get:
      tags:
        - Reports
      summary: Get stock report (JSON)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Stock report data

  /reports/stock/pdf:
    get:
      tags:
        - Reports
      summary: Export stock report as PDF
      security:
        - BearerAuth: []
      responses:
        '200':
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /reports/stock/csv:
    get:
      tags:
        - Reports
      summary: Export stock report as CSV
      security:
        - BearerAuth: []
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema:
                type: string

  /reports/movements:
    get:
      tags:
        - Reports
      summary: Get stock movements report
      security:
        - BearerAuth: []
      parameters:
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Movement report data

  /reports/movements/pdf:
    get:
      tags:
        - Reports
      summary: Export movements report as PDF
      security:
        - BearerAuth: []
      responses:
        '200':
          description: PDF file

  /reports/movements/csv:
    get:
      tags:
        - Reports
      summary: Export movements report as CSV
      security:
        - BearerAuth: []
      responses:
        '200':
          description: CSV file

  /reports/low-stock:
    get:
      tags:
        - Reports
      summary: Get low stock items
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Low stock items list

  # Activity Log Endpoints
  /activity:
    get:
      tags:
        - Activity
      summary: Get activity logs
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Activity logs retrieved

  # User Endpoints
  /user/profile:
    get:
      tags:
        - User
      summary: Get user profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile retrieved

    put:
      tags:
        - User
      summary: Update user profile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
      responses:
        '200':
          description: Profile updated

  /user/change-password:
    put:
      tags:
        - User
      summary: Change password
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 6
      responses:
        '200':
          description: Password changed successfully
        '400':
          description: Invalid current password

tags:
  - name: Authentication
    description: User authentication endpoints
  - name: Items
    description: Items management
  - name: Categories
    description: Categories management
  - name: Suppliers
    description: Suppliers management
  - name: Stock
    description: Stock movement tracking
  - name: Reports
    description: Export and reporting
  - name: Activity
    description: Activity logging
  - name: User
    description: User profile management
